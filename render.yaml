services:
  - type: web
    name: workpro-api
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PI_API_KEY
        sync: false  # Set via Render dashboard — never commit API keys to git
      - key: FRONTEND_URL
        value: https://cherry19899.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: workpro-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: workpro-db
    databaseName: workpro
    user: workpro
    plan: free
    ipAllowList: []
