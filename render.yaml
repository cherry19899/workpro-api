services:
  - type: web
    name: workpro-api
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Deliberately absent. Sandbox skips Pi accessToken verification entirely,
      # so anyone could log in as anyone; it must never be switched on from a
      # file that a blueprint sync could apply to the live service. Set it by
      # hand in the Render dashboard for a testnet deploy, and only to "true".
      - key: PI_API_KEY
        sync: false  # Set via Render dashboard — never commit API keys to git
      - key: FRONTEND_URL
        value: https://cherry19899.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: workpro-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: workpro-db
    databaseName: workpro
    user: workpro
    plan: free
    ipAllowList: []
