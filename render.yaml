services:
  - type: web
    name: workpro-api
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: workpro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://cherry19899.github.io
      - key: ADMIN_API_KEY
        value: dev
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health

databases:
  - name: workpro-db
    databaseName: workpro
    user: workpro
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere